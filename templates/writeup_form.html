{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Write-up | Signaller Web</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.png' %}">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { background: #f1f5f9; }
    </style>
</head>
<body>
<header>
    <div class="nav-container">
        <div class="logo-area">
            <img class="nav-logo" src="{% static 'assets/logo.png' %}" alt="Signaller Web">
            <span class="nav-title">Write-up Request</span>
        </div>
        <div class="nav-buttons-wrapper">
            <button onclick="window.location.href='/home'" class="login-btn" style="background:#64748b;">Home</button>
            <button onclick="logout()" class="login-btn" style="background:#ef4444;">Logout</button>
        </div>
    </div>
</header>

<div class="dash-main">
    <section class="dash-section">
        <h2>Request a Write-up</h2>
        <p style="color: var(--muted); margin-bottom: 20px;">Submit a write-up request for a signaller. It will be pending manager approval.</p>

        <form method="post" style="display: flex; flex-direction: column; gap: 16px; max-width: 600px;">
            {% csrf_token %}
            <label>
                Signaller Username:
                <input type="text" name="signaller" required
                       style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;">
            </label>
            <label>
                Reason / Incident Description:
                <textarea name="reason" rows="4" required
                          style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; resize: vertical;"></textarea>
            </label>
            <label>
                Evidence (links, image filenames, file names):
                <textarea name="evidence" rows="3" placeholder="e.g. IMG_20250801.jpg, https://example.com/report.pdf"
                          style="width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; resize: vertical;"></textarea>
            </label>
            <button type="submit" class="login-btn" style="align-self: flex-start;">Submit Write-up</button>
        </form>
    </section>

    {% if messages %}
    <ul class="messages" style="list-style: none; padding: 0; margin-top: 20px;">
        {% for message in messages %}
            <li style="padding: 10px 16px; border-radius: 8px; margin-bottom: 8px; background: {% if message.tags == 'error' %}#fee2e2; color: #dc2626{% elif message.tags == 'success' %}#dcfce7; color: #16a34a{% else %}#e0e7ff; color: #4f46e5{% endif %};">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>

<script src="{% static 'app.js' %}"></script>
</body>
</html>
