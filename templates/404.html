{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Not Found | Signaller Web</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'assets/favicon.png' %}">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
<header>
    <div class="nav-container">
        <div class="logo-area">
            <a href="/login"><img src="{% static 'assets/logo.png' %}" alt="Signaller Web" class="nav-logo"></a>
            <span class="nav-title">Signaller Web</span>
        </div>
        <a href="/login" class="login-btn" style="background:#4f46e5; color:#fff;">Login</a>
    </div>
</header>
<div class="error-container">
    <div class="error-content">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you’re looking for doesn’t exist or has been moved.</p>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
            <a href="/login" class="login-btn" style="background:#0f172a;">Go to Login</a>
            <a href="/investigations" class="login-btn" style="background:#4f46e5;">Investigations</a>
        </div>
    </div>
</div>
<footer class="corner-footer">
    <p>&copy; Signaller Web</p>
    <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms</a>
</footer>
</body>
</html>
