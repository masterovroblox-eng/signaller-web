services:
  - type: web
    name: signaller-web
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations web && python manage.py migrate && python manage.py collectstatic --noinput && python manage.py ensure_admin
    startCommand: gunicorn signaller.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: signaller-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: signaller-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: ChangeMe123!
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: PYTHON_VERSION
        value: "3.11.9"