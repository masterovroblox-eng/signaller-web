services:
  - type: web
    name: signaller-web
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn signaller.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: signaller-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: signaller-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"